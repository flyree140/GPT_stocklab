<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <meta
      name="description"
      content="StockLab Free AI：以 GitHub Actions、Hugging Face 開源模型與 Google Sheets 打造的免費台股新聞影響分析工具。"
    />
    <title>StockLab Free AI｜新聞影響與台股分析</title>
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#overview" aria-label="StockLab 首頁">
          <img src="./assets/logo.svg" alt="" width="38" height="38" />
          <span>
            <strong>StockLab</strong>
            <small>Free News AI</small>
          </span>
        </a>

        <div class="global-search">
          <label class="sr-only" for="stock-search">搜尋股票</label>
          <input id="stock-search" type="search" placeholder="搜尋代號或名稱，例如 2330、台積電" autocomplete="off" />
          <div id="search-results" class="search-results" hidden></div>
        </div>

        <div class="topbar-actions">
          <span id="data-status" class="status-pill">讀取資料中…</span>
          <button id="mobile-menu" class="icon-button mobile-only" type="button" aria-label="開啟選單">☰</button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="主要導覽">
        <nav>
          <button class="nav-item active" data-view="overview" type="button"><span>⌂</span>總覽</button>
          <button class="nav-item" data-view="daily" type="button"><span>★</span>每日精選</button>
          <button class="nav-item" data-view="news" type="button"><span>◫</span>新聞影響</button>
          <button class="nav-item" data-view="scanner" type="button"><span>⌁</span>條件篩選</button>
          <button class="nav-item" data-view="traditional" type="button"><span>▥</span>傳統分析</button>
          <button class="nav-item" data-view="favorites" type="button"><span>♥</span>我的最愛 <b id="favorite-count">0</b></button>
          <button class="nav-item" data-view="validation" type="button"><span>↶</span>歷史驗證</button>
          <button class="nav-item" data-view="method" type="button"><span>i</span>方法說明</button>
          <button class="nav-item" data-view="settings" type="button"><span>⚙</span>同步設定</button>
        </nav>
        <div class="sidebar-note">
          <strong>完全免費模式</strong>
          <span>GitHub Pages + Actions<br />Hugging Face 開源模型<br />Google Sheets</span>
        </div>
      </aside>

      <main id="app" class="main-content" tabindex="-1">
        <div class="loading-card">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在載入分析資料…</p>
        </div>
      </main>
    </div>

    <dialog id="stock-dialog" class="stock-dialog">
      <button class="dialog-close" data-action="close-dialog" type="button" aria-label="關閉">×</button>
      <div id="stock-dialog-content"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>此網站需要啟用 JavaScript 才能顯示分析結果。</noscript>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
