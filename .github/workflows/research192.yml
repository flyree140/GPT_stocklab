name: Refresh Six-Factor Research 19.2
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocklab16-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKLAB_192_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m stocklab192.runtime --root .
      - run: |
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git add data/research192
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: six-factor 19.2 sidecar, no model calls"
          git push origin HEAD:main
