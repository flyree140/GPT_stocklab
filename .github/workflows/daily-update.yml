name: Daily StockLab 16 research
on:
  workflow_dispatch:
    inputs:
      skip_qwen:
        description: Skip optional Qwen; use numerical evidence rules
        type: boolean
        default: true
      as_of:
        description: Optional YYYY-MM-DD (empty = today in Taipei)
        type: string
        required: false
  schedule:
    - cron: '17 0 * * *' # UTC -> Taipei 08:17; not a guaranteed delivery time
    - cron: '17 13 * * *' # UTC -> Taipei 21:17; second news pass; same-day earlier run does not skip it
permissions:
  contents: write
concurrency:
  group: stocklab16-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENABLE_QWEN: ${{ vars.STOCKLAB_192_ENABLED == '1' && '0' || (github.event_name == 'workflow_dispatch' && inputs.skip_qwen && '0' || '1') }}
      STOCKLAB_192_ENABLED: ${{ vars.STOCKLAB_192_ENABLED || '0' }}
      STOCKLAB_ADAPTER_REPO: ${{ vars.STOCKLAB_ADAPTER_REPO }}
      STOCKLAB_ADAPTER_REVISION: ${{ vars.STOCKLAB_ADAPTER_REVISION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SKIP_ADAPTER192: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_qwen && '1' || '0' }}
      QWEN_DAILY_LIMIT: ${{ vars.QWEN_DAILY_LIMIT || '12' }}
      QWEN_RUN_LIMIT: ${{ vars.QWEN_RUN_LIMIT || '6' }}
      QWEN_BATCH_SECONDS: '720'
      NEWS_PER_STOCK: ${{ vars.NEWS_PER_STOCK || '20' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
      FAVORITES_FEED_URL: ${{ secrets.FAVORITES_FEED_URL }}
      FAVORITES_READ_TOKEN: ${{ secrets.FAVORITES_READ_TOKEN }}
      DEEP_STOCK_LIMIT: '20'
      TARGET_DATE: ${{ inputs.as_of }}
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Backup schedule guard
        id: preflight
        run: python -m stocklab16.preflight
      - uses: actions/setup-python@v6
        if: steps.preflight.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-models.txt
      - uses: actions/cache@v5
        if: steps.preflight.outputs.skip != 'true' && (env.ENABLE_QWEN == '1' || (env.STOCKLAB_192_ENABLED == '1' && env.SKIP_ADAPTER192 != '1'))
        with:
          path: .cache/huggingface
          key: stocklab192-c1899de-${{ runner.os }}-${{ vars.STOCKLAB_ADAPTER_REVISION || 'base' }}
      - name: Install core dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Install optional CPU model dependencies
        if: steps.preflight.outputs.skip != 'true' && (env.ENABLE_QWEN == '1' || (env.STOCKLAB_192_ENABLED == '1' && env.SKIP_ADAPTER192 != '1'))
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-models.txt
      - name: Refresh company catalog
        if: steps.preflight.outputs.skip != 'true'
        run: python -m stocklab16.universe
      - name: Refresh verified market calendar (retain previous if unavailable)
        if: steps.preflight.outputs.skip != 'true'
        run: python -m stocklab193.calendar_update
      - name: Generate new snapshot
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m stocklab16.build --as-of "$TARGET_DATE"
          else
            python -m stocklab16.build
          fi
      - name: Build simple life-mode inputs and cross-check official close
        if: steps.preflight.outputs.skip != 'true'
        run: python -m stocklab18.prepare --verify
      - name: Build six-factor research and optional own-adapter shadow
        if: steps.preflight.outputs.skip != 'true'
        run: python -m stocklab192.runtime --root .
      - name: Test before publication
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python -m stocklab16.quality
          pytest -q
          node tests/test_engine.mjs
          node tests/test_life18.mjs
          node tests/test_intent19.mjs
          node tests/test_cloud19.mjs
          node tests/test_paperlab.mjs
          node tests/test_paper193.mjs
      - name: Commit valid data
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: StockLab 19.3 $(TZ=Asia/Taipei date +%F)"
          git push origin HEAD:main
      - name: Persist attempted model quota after failure (no invalid snapshots)
        if: failure()
        run: |
          if [ ! -f data/system/qwen-state.json ]; then exit 0; fi
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git reset
          git add data/system/qwen-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist bounded Qwen attempts"
          git push origin HEAD:main
