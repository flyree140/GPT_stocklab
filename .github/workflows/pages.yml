name: Deploy StockLab 16 Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'tutorial.html', 'runtime.json', 'assets/**', 'data/**', 'stocklab16/stage.py', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Daily StockLab 16 research', 'Historical StockLab 16 snapshot', 'Re-analyze saved snapshots']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Stage website including tutorial; preserve existing data
        run: python -m stocklab16.stage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: _site}
      - uses: actions/deploy-pages@v4
        id: deployment
