name: Quality checks

on:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: |
          python scripts/quality_check.py
          pytest -q
