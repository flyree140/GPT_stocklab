name: Update Life Mode
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocklab16-data
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Verify, rebuild salary ledger, prepare latest inputs (no Qwen)
        run: |
          python -m stocklab17.audit
          python -m stocklab17.planner
          python -m stocklab18.report
          python -m stocklab18.prepare --verify
          python -m stocklab16.quality
          pytest -q
          node tests/test_life18.mjs
      - name: Commit derived files only, preserve original snapshot evidence
        run: |
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git add data/evaluation data/plans data/plan_runs data/life
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: life-mode audit and planning inputs"
          git push origin HEAD:main
