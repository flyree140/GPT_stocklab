name: Re-analyze saved snapshots
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocklab16-data
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Recompute evidence rules offline; original run files stay intact
        run: python -m stocklab16.migrate
      - run: python -m stocklab16.quality && pytest -q
      - run: |
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: append 16.1 retrospective re-analysis (preserve originals)"
          git push origin HEAD:main
