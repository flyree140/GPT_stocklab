const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numberOrNull=v=>v===''||v===null?null:Number.isFinite(Number(v))?Number(v):null;
function scenario(eps,old,target,price){
 const good=x=>x!==null&&Number.isFinite(x)&&x>0;
 return {revision:good(eps)&&good(old)?(eps/old-1)*100:null,
  pair:good(eps)&&good(target)?target/eps:null,pe:good(eps)&&good(price)?price/eps:null,
  gap:good(price)&&good(target)?(target/price-1)*100:null};
}
function positionSize(capital,riskPct,entry,stop,fees=0.006){
 if(![capital,riskPct,entry,stop,fees].every(Number.isFinite)||capital<=0||riskPct<=0||riskPct>100||entry<=0||stop<=0||stop>=entry||fees<0)return null;
 const risk=capital*riskPct/100,perShare=entry-stop+entry*fees;
 return {budget:risk,perShare,shares:Math.max(0,Math.min(Math.floor(risk/perShare),Math.floor(capital/(entry*(1+fees)))))};
}
function tutorialHTML(){return `
<div class="learn-hero"><span class="eyebrow">STOCKLAB ACADEMY · 16.1</span><h2>把新聞，變成可檢驗的投資假設</h2><p>先分清「事實、預估、價格」。不需要把每個分數背起來；你需要知道下一步查什麼、什麼會推翻原本的看法。</p><div class="learn-path"><a href="#lesson-1">01 先看改變</a><a href="#lesson-2">02 看數字</a><a href="#lesson-3">03 看價格</a><a href="#lesson-4">04 做情境</a><a href="#lesson-5">05 控風險</a><a href="#lesson-6">06 盲測驗證</a></div></div>
<div class="learn-callout"><b>六個面向不是六個答案。</b> 新聞正向，只表示資訊可能改善；價格已漲很多、估值或報酬／風險不合理時，仍可能不適合進場。研究分不是勝率。</div>
<section class="lesson" id="lesson-1"><div class="lesson-head"><span>01</span><div><small>從網站開始</small><h3>60 秒讀懂一檔股票</h3></div></div><div class="learn-steps"><div><b>先看日期與版本</b><p>確認不是示範資料。切到歷史日期，就只能用當時資訊。舊版 JSON 不會因換介面自動變成新分析。</p></div><div><b>打開「股票研究」</b><p>先讀未通過的關卡，再看分數。價格、營運、估值與證據不是互相替代的。</p></div><div><b>分開空手與持有</b><p>空手者找新增風險是否值得承擔；持有者檢查買進理由是否失效，不只問「明天會不會漲」。</p></div></div><button class="btn" data-pagejump="stocks">前往股票研究 →</button></section>
<section class="lesson" id="lesson-2"><div class="lesson-head"><span>02</span><div><small>用你指出的三則標題示範</small><h3>營收、EPS 預估與目標價，不能混成同一種利多</h3></div></div><p class="subtle">以下只解讀使用者提供的標題，沒有核對新聞全文，並非即時投資建議。</p><div class="lesson-cases">
<article><span class="lesson-type">已披露營收變化</span><h4>群聯：8月營收年增377%</h4><div class="lesson-number">+377%<small>比去年同月成長</small></div><p>知道的是「營收規模」大增，不是每股盈餘增377%。標題沒提供金額與月增率，不能算出多賺多少錢。</p><div class="learn-equation">營收增長 → 拆低基期／量價／併購 → 季報驗證獲利與現金流</div><b>下一份要找的資料</b><p>同口徑月營收表、前月比較、存貨及營業現金流。若只是低基期，不能假設未來仍有同樣增幅。</p></article>
<article><span class="lesson-type">半導體的分析師預估</span><h4>信驊：EPS預估194.98元／目標價22,500元</h4><div class="lesson-number">115.40×<small>22,500 ÷ 194.98，純標題配對</small></div><p>目標價不是目前股價；沒有舊 EPS，不能算上修百分比。也不能把194.98元直接拿來和別家EPS排名。</p><div class="learn-equation">預估EPS → 核對同年度新舊值 → 對照產品需求與估值假設</div><b>下一份要找的資料</b><p>EPS年度、舊預估、預估分歧、公司展望。115.40倍不是已核對本益比，須確認兩個數字的期間一致。</p></article>
<article><span class="lesson-type">金融股的分析師預估</span><h4>中信金：EPS預估4.31元／目標價73.5元</h4><div class="lesson-number">17.05×<small>73.5 ÷ 4.31，純標題配對</small></div><p>新聞型態雖相同，營運驅動不同。金融股優先拆淨利差、信用成本、手續費及ROE；不是檢查製造業毛利率。</p><div class="learn-equation">預估EPS → 拆金融本業與一次性損益 → PB／ROE與信用風險</div><b>下一份要找的資料</b><p>同年度舊預估、股價淨值比、資產品質；金控另檢查保險損益。17.05倍不代表比半導體便宜。</p></article></div>
<div class="learn-callout"><b>為什麼兩則 EPS 消息仍可能同分？</b> 它們都只有「上修方向」，缺上次同年度 EPS。系統不因194.98比4.31大就加更多分。數字用途、追蹤指標與投資情境不同，但相同證據強度可以同分。</div></section>
<section class="lesson" id="lesson-3"><div class="lesson-head"><span>03</span><div><small>價格與動能</small><h3>指標告訴你現在的位置，不保證下一步</h3></div></div><div class="learn-steps"><div><b>K線：一個交易日的四個價格</b><svg viewBox="0 0 380 135" role="img" aria-label="紅漲K線，高點、收盤、開盤、低點示意"><line x1="90" x2="90" y1="12" y2="125" stroke="#bf5367" stroke-width="3"/><rect x="72" y="40" width="36" height="48" fill="#bf5367"/><g fill="#314b53" font-size="14"><text x="134" y="18">最高價：當日最貴</text><text x="134" y="48">收盤價：最後的位置</text><text x="134" y="90">開盤價：起點</text><text x="134" y="126">最低價：當日最低</text></g></svg><p>長上影代表曾漲上去又回落；不是看到一根就能斷言反轉。先把成交量與附近壓力一起看。</p></div><div><b>MA20／MA60：月線與季線</b><p>20／60個交易日平均收盤。價格高於均線表示相對強勢，但離均線太遠仍可能是追價。</p><b>RSI：近期漲跌動能</b><p>本版使用 Wilder 14期平滑。高於70不是必跌，低於30不是必漲；訊號需要價格確認。</p></div><div><b>KD／MACD：交叉不是位置</b><p>「今天K&gt;D」只代表在上方。黃金交叉還要求前一天K≤D，今天才穿越。MACD同樣要和前一日比較。</p><b>量比：今天÷前五日均量</b><p>本版均量不含今天。放量上漲／下跌意義不同；單看1.5倍成交量不能確認誰在買。</p></div></div><p class="subtle">研究頁快捷篩選是找符合條件的股票，不是自動買進訊號；沒資料會排除，不會補成通過。</p></section>
<section class="lesson" id="lesson-4"><div class="lesson-head"><span>04</span><div><small>可改數字、看公式</small><h3>EPS／估值情境實驗室</h3></div></div><p>預設是教學假設，並非股票行情。清空「舊 EPS」即可看到為何沒有基準就不能算修訂幅度。</p><div class="calc-grid"><label>新 EPS 預估（元）<input id="learn-eps" type="number" value="194.98" step="0.01"></label><label>同年度舊 EPS（可留空）<input id="learn-old" type="number" placeholder="缺值就不能算修訂"></label><label>報導目標價（元）<input id="learn-target" type="number" value="22500" step="0.01"></label><label>自訂股價假設（元）<input id="learn-price" type="number" placeholder="自行輸入，不抓即時行情"></label></div><div id="learn-scenario-result" class="calc-result" aria-live="polite"></div><p class="subtle">目標價／EPS只是配對情境，先確認預測年度。不同產業的 PE 不能直接比較；相同PE也不代表相同風險。</p></section>
<section class="lesson" id="lesson-5"><div class="lesson-head"><span>05</span><div><small>先定願意承擔多少，再算股數</small><h3>風險預算試算</h3></div></div><div class="calc-grid"><label>模擬總資金<input id="learn-capital" type="number" value="100000"></label><label>單筆預算風險 %<input id="learn-risk" type="number" value="1" step="0.1"></label><label>進場價假設<input id="learn-entry" type="number" value="100" step="0.1"></label><label>停損價假設<input id="learn-stop" type="number" value="94" step="0.1"></label></div><div id="learn-size-result" class="calc-result" aria-live="polite"></div><p class="subtle">示範額外預留進場金額0.6%作為粗略往返成本，不是法定稅率。跳空、漲跌停與無法成交可讓損失超過預算；此股數不屬於個人化配置建議。</p></section>
<section class="lesson" id="lesson-6"><div class="lesson-head"><span>06</span><div><small>讓規則接受檢驗</small><h3>先封存假設，再揭曉結果</h3></div></div><div class="learn-flow"><span>① 選歷史快照</span><b>→</b><span>② 記錄買入理由與失效條件</span><b>→</b><span>③ 設T+1進場與成本</span><b>→</b><span>④ 明確揭曉後續行情</span></div><div class="learn-steps"><div><b>不能偷用同日收盤成交</b><p>收盤後才看到資訊，就用下一個可交易日開盤作模擬。次日跳空會改變價格與風險。</p></div><div><b>看完整紀錄，不只看贏家</b><p>把觀望、虧損、未到期持倉也記下。重疊交易不能把逐筆報酬直接串乘成組合年報酬。</p></div><div><b>改規則後是新實驗</b><p>16.1重新分析舊資料是事後重算，不是當時預測。保留原始快照，再用未參與調參的期間測試。</p></div></div><button class="btn" data-pagejump="sim">前往試買模擬 →</button></section>
<section class="lesson" id="lesson-7"><div class="lesson-head"><span>07</span><div><small>分數透明</small><h3>＋29.6不是讓股票總分直接加29.6</h3></div></div><div class="learn-equation">單則事件分 → 時效折減 → 相關事件平均 → 新聞因子0–100 → 30%權重 → 資料不足與風險扣分</div><p>例如新聞因子60分，相對中立50分只增加 <b>(60−50)×30%＝3分</b>。其他五面向仍可能拖累總分。每張卡可展開計分明細核對。</p><details><summary>證據層級折減0.55是正確率嗎？</summary><p>不是。它是未校準的研究規則，用來限制標題型證據的權重。不能把0.55讀成55%機率或模型準確率。</p></details><details><summary>缺值為什麼不給50分？</summary><p>缺資料代表沒有完成該面向檢查；系統不賦予樂觀貢獻，還會扣除完整度。沒有新聞和中性新聞也不是同一回事。</p></details><details><summary>Qwen關掉會不會又全部同一句？</summary><p>數字擷取、事件細分、產業專屬追蹤及價格關卡由本地規則負責。Qwen只補證據分類，不虛構舊EPS或擅自給目標價；停用Qwen也保留差異分析。</p></details><div class="learn-quiz"><h4>練習：看到「EPS預估4.31元」就能算上修多少嗎？</h4><button class="btn" data-answer="wrong">能，EPS是正數就是上修</button><button class="btn" data-answer="right">不能，還要同年度舊預估</button><p id="learn-quiz-result" aria-live="polite"></p></div></section>
<section class="lesson learn-sources"><h3>参考與設計界線</h3><p>快捷健檢、條件篩選、進場者／持有者分流，參考公開範例的優點重新實作。未複製其程式碼、品牌，也未照搬固定±5%／10%價位或把超賣當作反彈保證。</p><a href="https://kmuftp-creater.github.io/tw-stock-analyzer/" target="_blank" rel="noopener">參考網站的公開說明</a> · <a href="https://huggingface.co/Qwen/Qwen3-0.6B" target="_blank" rel="noopener">Qwen模型卡</a> · <a href="https://docs.github.com/en/billing/concepts/product-billing/github-actions" target="_blank" rel="noopener">GitHub免費運算條件</a><p>本頁案例與參數用於研究教學，不提供保證獲利或個人化買賣建議。</p></section>`;}
function mountTutorial(root){
 const find=id=>root.querySelector('#'+id),value=id=>numberOrNull(find(id).value);
 function recalc(){
  const x=scenario(value('learn-eps'),value('learn-old'),value('learn-target'),value('learn-price'));
  const n=x=>x===null?'缺比較基準':x.toLocaleString('zh-TW',{maximumFractionDigits:2});
  find('learn-scenario-result').innerHTML=[['EPS修訂幅度',n(x.revision)+(x.revision===null?'':'%'),'（新EPS÷舊EPS−1）×100'],['目標價／EPS配對',n(x.pair)+(x.pair===null?'':'倍'),'報導目標價÷EPS；非本站預測'],['自訂股價／EPS',n(x.pe)+(x.pe===null?'':'倍'),'假設股價÷EPS，非已核對估值'],['到報導目標的空間',n(x.gap)+(x.gap===null?'':'%'),'目標÷假設股價−1，非預期報酬']].map(([a,b,c])=>`<div><small>${E(a)}</small><b>${E(b)}</b><span>${E(c)}</span></div>`).join('');
  const p=positionSize(value('learn-capital'),value('learn-risk'),value('learn-entry'),value('learn-stop'));
  find('learn-size-result').innerHTML=p?`<div><small>風險預算</small><b>${n(p.budget)}元</b><span>資金×自訂風險%</span></div><div><small>含粗估成本的每股風險</small><b>${n(p.perShare)}元</b><span>進場−停損＋進場×0.6%</span></div><div><small>模擬股數上限</small><b>${n(p.shares)}股</b><span>向下取整並限制不超出資金</span></div>`:'<p>請輸入正數，且停損價低於進場價。此試算只適用買進股票的教學情境。</p>';
 }
 root.querySelectorAll('input').forEach(el=>el.addEventListener('input',recalc));recalc();
 root.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>{find('learn-quiz-result').textContent=el.dataset.answer==='right'?'正確：還要確認新舊EPS的預測年度相同，才能算修訂百分比。':'還不行：EPS為正只是預估獲利，不代表比上次預估更高。'}));
 root.querySelectorAll('.learn-path a').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();root.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'});}));
}

const root=document.getElementById('tutorial');root.innerHTML=tutorialHTML();mountTutorial(root);
if(location.hash)requestAnimationFrame(()=>{const target=document.getElementById(location.hash.slice(1));if(target)target.scrollIntoView();});
root.querySelectorAll('[data-pagejump]').forEach(b=>b.onclick=()=>{location.href='index.html#'+b.dataset.pagejump});
</script></body></html>
